services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: tre_n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no arquivo .env}
      - EVOLUTION_SERVER_URL_INTERNAL=http://evolution-api:8080
      - WHATSAPP_CLIENT_NAME=${WHATSAPP_CLIENT_NAME:-GENERIC_POC}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434/api/chat}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: tre_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      - POSTGRES_DB=${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tre_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: tre_evolution_api
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no arquivo .env}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}?schema=public
      - CONFIG_SESSION_PHONE_CLIENT=${WHATSAPP_CLIENT_NAME:-GENERIC_POC}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:${REDIS_PORT:-6379}/${REDIS_DB:-6}
      - CACHE_REDIS_PREFIX_KEY=${REDIS_PREFIX:-evolution}
      - CACHE_REDIS_SAVE_INSTANCES=false
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
  evolution_instances:
  evolution_store:
  redis_data:
